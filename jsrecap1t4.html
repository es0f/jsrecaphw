<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task4</title>
</head>
<body>
<script>
    let score = Number(prompt("Enter your score:"));
    let grade;

    if (score >=0 && score <= 39){
        grade = 0;
    } else if (score <= 51){
        grade = 1;
    } else if (score <= 63){
        grade = 2;
    } else if (score <= 75){
        grade = 3;
    } else if (score <= 87){
        grade = 4;
    } else if (score <=100){
        grade = 5;
    }
    document.write("<p>Your grade: " + grade + "</p>")
</script>
</body>
</html>
