<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task3</title>
</head>
<body>
<script>
    let a = Number(prompt("Enter 1st side:"));
    let b = Number(prompt("Enter 2nd side:"));
    let c = Number(prompt("Enter 3rd side:"));

    let result;
    if (a === b && b === c) {
        result = "Equilateral";
    } else if (a === b || a === c || b === c) {
        result = "isosceles";
    } else {
        result = "Scalene"
    }
    document.write("<p>Triangle type: " + result + "</p>");
</script>
</body>
</html>
